version: 3

includes:
    core:
        taskfile: ./core/Taskfile.yml
        dir: ./core
    console:
        taskfile: ./console/Taskfile.yml
        dir: ./console

tasks:
    dev:
        deps: [task: core:dev, task: console:dev]
    setup:
        deps: [task: core:setup, task: console:setup]
    test:
        deps: [task: core:test, task: console:test]
    typecheck:
        deps: [task: console:typecheck]
    lint:
        deps: [task: core:lint, task: console:lint]
    pretty:
        deps: [task: core:pretty, task: console:pretty]
    build:
        deps: [task: core:build, task: console:build]
