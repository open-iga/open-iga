post:
    operationId: createWorkflow
    description: >-
        Create a workflow. The systems, resources, tenants and entitlements its steps name must exist;
        otherwise nothing is saved. A workflow with the same name is not replaced.
    requestBody:
        required: true
        content:
            'application/json':
                schema:
                    type: object
                    properties:
                        name:
                            type: string
                            description: Name of the workflow. Free to choose, e.g. onboarding-contractors
                        type:
                            $ref: '../schemas/workflow-type.yml'
                        steps:
                            $ref: '../schemas/workflow-steps.yml'
                    required: [name, type, steps]
    responses:
        201:
            description: Workflow created
        400:
            $ref: '../components/responses/bad-request-error.yml'
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        409:
            $ref: '../components/responses/conflict-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
put:
    operationId: setWorkflowSchedule
    description: >-
        Save the schedule of a workflow, replacing the one it has. Only the discovery workflow has a schedule so far.
        A change applies within seconds.
    requestBody:
        required: true
        content:
            'application/json':
                schema:
                    type: object
                    additionalProperties: false
                    properties:
                        name:
                            type: string
                            description: Name of the workflow, e.g. discovery
                        schedule:
                            $ref: '../schemas/workflow-schedule.yml'
                    required: [name, schedule]
    responses:
        204:
            description: Schedule saved
        400:
            $ref: '../components/responses/bad-request-error.yml'
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
