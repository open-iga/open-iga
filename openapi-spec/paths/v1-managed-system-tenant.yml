get:
    operationId: listManagedSystemTenants
    description: List the tenants onboarded under a managed system
    parameters:
        - name: id
          in: path
          required: true
          description: Id of the managed system the tenants belong to
          schema:
              type: string
    responses:
        200:
            description: Tenants onboarded under the managed system
            content:
                'application/json':
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                id:
                                    type: string
                                externalId:
                                    type: string
                                    description: Tenant id in the target system (realm name, account id, ...)
                                name:
                                    type: string
                                    description: Human readable tenant name
                                createdAt:
                                    type: string
                                    format: date-time
                            required: [id, externalId, name, createdAt]
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
post:
    operationId: onboardManagedSystemTenant
    description: Onboard a tenant under a managed system. Call once per tenant.
    parameters:
        - name: id
          in: path
          required: true
          description: Id of the managed system the tenant belongs to
          schema:
              type: string
    requestBody:
        required: true
        content:
            'application/json':
                schema:
                    type: object
                    properties:
                        externalId:
                            type: string
                            description: Tenant id in the target system (realm name, account id, ...)
                        name:
                            type: string
                            description: Human readable tenant name
                    required: [externalId, name]
    responses:
        200:
            description: Tenant already existed; returned unchanged (idempotent)
            content:
                'application/json':
                    schema: &tenantResult
                        type: object
                        properties:
                            id:
                                type: string
                                description: Id of the onboarded tenant
                        required: [id]
        201:
            description: Tenant onboarded
            content:
                'application/json':
                    schema: *tenantResult
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
