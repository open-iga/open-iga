post:
    operationId: continueWorkflowStep
    description: Continue a step that is waiting at its gate
    parameters:
        - name: name
          in: path
          required: true
          description: Name of the workflow, e.g. onboarding
          schema:
              type: string
        - name: id
          in: path
          required: true
          description: Id of the run, which must belong to the workflow
          schema:
              type: string
        - name: step
          in: path
          required: true
          description: Name of the gated step
          schema:
              type: string
    responses:
        204:
            description: The step continues
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        409:
            $ref: '../components/responses/conflict-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
