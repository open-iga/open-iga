get:
    operationId: getWorkflow
    description: >-
        Get a saved workflow. The discovery workflow is built in and has no steps,
        as they are built from the managed systems at each run.
    parameters:
        - &workflowName
          name: name
          in: path
          required: true
          description: Name of the workflow
          schema:
              type: string
    responses:
        200:
            description: The workflow and its steps
            content:
                'application/json':
                    schema:
                        type: object
                        properties:
                            name:
                                type: string
                            type:
                                $ref: '../schemas/workflow-type.yml'
                            steps:
                                $ref: '../schemas/workflow-steps.yml'
                            schedule:
                                $ref: '../schemas/workflow-schedule.yml'
                        required: [name, type, steps]
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
