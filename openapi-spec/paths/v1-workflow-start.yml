post:
    operationId: startWorkflow
    description: >-
        Start a run of a saved workflow, or of the built-in discovery workflow.
        The run goes on in the background; follow it with the run id.
    parameters:
        - name: name
          in: path
          required: true
          description: Name of the workflow, e.g. onboarding
          schema:
              type: string
    requestBody:
        required: false
        content:
            'application/json':
                schema:
                    type: object
                    properties:
                        identityId:
                            type: string
                            description: Id of the identity the run is about. Required, except for discovery, which is about no identity.
    responses:
        201:
            description: Run started
            content:
                'application/json':
                    schema:
                        type: object
                        properties:
                            id:
                                type: string
                                description: Id of the run
                        required: [id]
        204:
            description: Nothing to run, so no run started. Only discovery does this, when there is no system to discover.
        400:
            $ref: '../components/responses/bad-request-error.yml'
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
