post:
    operationId: onboardManagedSystem
    description: To onboard managed-systems along with connectors
    requestBody:
        description: Details required to create a managed-system
        required: true
        content:
            'application/json':
                schema:
                    type: object
                    properties:
                        managedSystemName:
                            type: string
                        connectorUrl:
                            type: string
                        connectorSha:
                            type: string
                    required: [managedSystemName, connectorUrl, connectorSha]
    responses:
        '201':
            description: Managed system has been successfully created
            content:
                'application/json':
                    schema:
                        properties:
                            managedSystemId:
                                type: string
                        required: [managedSystemId]
