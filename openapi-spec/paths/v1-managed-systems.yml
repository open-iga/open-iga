get:
    operationId: listManagedSystems
    description: List the onboarded managed systems
    responses:
        200:
            description: Onboarded managed systems
            content:
                'application/json':
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                id:
                                    type: string
                                name:
                                    type: string
                                connectorUrl:
                                    type: string
                                connectorHash:
                                    type: string
                                createdAt:
                                    type: string
                                    format: date-time
                            required: [id, name, connectorUrl, connectorHash, createdAt]
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
post:
    operationId: onboardManagedSystem
    description: Onboard managed systems after connector validation
    requestBody:
        required: true
        content:
            'application/json':
                schema:
                    properties:
                        connectorOnboardingId:
                            type: string
                            description: Connector onboarding ID tat passed validation
                    required: [connectorOnboardingId]
    responses:
        200:
            content:
                'application/json':
                    schema:
                        properties:
                            id:
                                type: string
                                description: Id of the onboarded managed system
                        required: [id]
        401:
            $ref: '../components/responses/unauthenticated-error.yml'
        404:
            $ref: '../components/responses/not-found-error.yml'
        409:
            $ref: '../components/responses/conflict-error.yml'
        500:
            $ref: '../components/responses/internal-server-error.yml'
