openapi: '3.0.4'
info:
    title: OpenIGA
    description: Collection of endpoints for OpenIGA
    version: 1.0.0

paths:
    '/api/health':
        get:
            $ref: './paths/health.yml'
    '/api/v1/auth/{provider}':
        get:
            $ref: './paths/v1-auth-login.yml'
    '/api/v1/auth/{provider}/callback':
        post:
            $ref: './paths/v1-auth-callback.yml'
    '/api/v1/auth/logout':
        post:
            $ref: './paths/v1-auth-logout.yml'
    '/api/v1/users':
        get:
            $ref: './paths/v1-user-details.yml'
    '/api/v1/connectors/onboarding-requests':
        post:
            $ref: './paths/v1-connectors-onboarding-request.yml'
    '/api/v1/connectors/onboarding-requests/{onboarding-id}':
        get:
            $ref: './paths/v1-connectors-onboarding-request-details.yml'
