# The connector spec is a map and is already a decoded value. This is to prevent JSON marshal/unmarshall again
x-go-type: domain.ConnectorSpec
x-go-type-import:
    path: github.com/open-iga/core/internal/domain
type: object
properties:
    name:
        type: string
    description:
        type: string
    config:
        type: array
        items: &configItem
            type: object
            properties:
                name:
                    type: string
                description:
                    type: string
                required:
                    type: boolean
            required: [name, description, required]
    allowedDomains:
        type: array
        items:
            type: string
    actions:
        type: object
        additionalProperties:
            type: object
            properties:
                create: &operation
                    type: object
                    properties:
                        endpoints:
                            type: array
                            items: &endpoint
                                type: object
                                properties:
                                    method:
                                        type: string
                                    url:
                                        type: string
                                    description:
                                        type: string
                                required: [method, url, description]
                        description:
                            type: string
                        config:
                            type: array
                            items: *configItem
                    required: [endpoints, description, config]
                enable: *operation
                disable: *operation
                delete: *operation
                read: *operation
    entitlements:
        type: object
        additionalProperties:
            type: object
            properties:
                discover: *operation
                grant: *operation
                revoke: *operation
                read: *operation
required: [name, description, config, allowedDomains, actions, entitlements]
