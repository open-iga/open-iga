# Dev tooling for core. Install everything with `mise install`.
# Tools live in mise's own directory, so they never touch core/go.mod.
[tools]
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:air-verse/air" = "1.65.1"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:mvdan/gofumpt" = "0.12.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.7.0"
"go:go.uber.org/mock/mockgen" = "0.6.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
