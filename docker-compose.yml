# Local observability: grafana/otel-lgtm bundles an OTel Collector with
# Prometheus (metrics), Tempo (traces), Loki (logs) and Grafana (UI).
# Run `docker compose up -d`, then open Grafana at http://localhost:3001
# (anonymous admin). The core service sends OTLP to localhost:4318 by default.
services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: open-iga-otel
    environment:
      - GF_SERVER_HTTP_PORT=3001 # avoid clash with the console on :3000
    ports:
      - "3001:3001" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
